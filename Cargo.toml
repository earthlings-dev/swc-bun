[workspace]
resolver = "3"
members = [
  "xtask",
  "bindings/*",
  "crates/*",
  "tools/generate-code",
  "tools/swc-releaser",
  # extra-bindings
  "extra-bindings/crates/css_node",
  "extra-bindings/crates/linter_node",
  # plugins - library crates
  "plugins/crates/swc_experimental_babel",
  "plugins/crates/swc_feature_flags",
  "plugins/crates/swc_icu_messageformat_parser",
  # plugins - packages (plugin wrappers)
  "plugins/packages/emotion",
  "plugins/packages/feature-flags",
  "plugins/packages/formatjs",
  "plugins/packages/jest",
  "plugins/packages/loadable-components",
  "plugins/packages/noop",
  "plugins/packages/prefresh",
  "plugins/packages/react-remove-properties",
  "plugins/packages/relay",
  "plugins/packages/remove-console",
  "plugins/packages/styled-components",
  "plugins/packages/styled-jsx",
  "plugins/packages/swc-confidential",
  "plugins/packages/swc-magic",
  "plugins/packages/swc-sdk",
  "plugins/packages/transform-imports",
  # plugins - packages (transform crates)
  "plugins/packages/emotion/transform",
  "plugins/packages/formatjs/transform",
  "plugins/packages/prefresh/transform",
  "plugins/packages/react-remove-properties/transform",
  "plugins/packages/relay/transform",
  "plugins/packages/remove-console/transform",
  "plugins/packages/styled-components/transform",
  "plugins/packages/styled-jsx/transform",
  "plugins/packages/swc-confidential/transform",
  "plugins/packages/swc-magic/transform",
  "plugins/packages/swc-sdk/transform",
  "plugins/packages/transform-imports/transform",
  # plugins - contrib
  "plugins/contrib/graphql-codegen-client-preset",
  "plugins/contrib/mut-cjs-exports",
]
[workspace.package]
edition      = "2024"
rust-version = "1.94"
license      = "Apache-2.0"
repository   = "https://github.com/swc-project/swc.git"


